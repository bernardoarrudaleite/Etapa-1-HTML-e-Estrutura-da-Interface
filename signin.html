<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
</head>
<body>

    <section id="sign in">
        <h1>Sign In</h1>
        <form>
            <p>

                <label for="name">Name:</label>
                <input 
                
                type="text" 
                
                name="name" 
                
                id="name"
                
                required
                >
            
            </p>
            
            <p>

                <label for="email">E-mail:</label>

                <input 
                
                type="email"
                
                name="email"
                
                id="email"
                
                required
                >
            </p>

            <p>

                <label for="senha">Crie Uma Senha:</label>

                <input type="password"
                
                name="senha"
                
                id="senha"
                
                required
                >

            </p>

            <button type="submit">
                    <a href="index.html"> Submit</a>
                </button>
        </form>
    </section>
    
</body>
</html>
