<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

    <section id="login">
            <h2>Login</h2>
             <form>
                <p>
                    <label for="email">E-mail:</label>

                    <input 
                      
                      type="email"
                      
                      id="email"
                      
                      name="email"
                      
                      required
                      >
                </p>
               
                <p>
                    <label for="senha">Senha:</label>

                    <input 
                    
                    type="password"
                    
                    id="senha"

                    name="senha"

                    required
                    >
                </p>
                
                <p>
                   
                    <input 
                    
                    type="checkbox"
                    
                    name="continuar"
                    
                    id="continuar">
                    <label for="continuar">Se Manter Conectado</label>
                </p>
                
                <p> 
                    <input 
                    
                    type="checkbox" 
                    
                    name="notificacoes" 
                    
                    id="notificacoess">
                    
                    <label for="notificacoes">Notificações De Atualizações</label>
                </p>
                
                <button type="submit">
                    Login in
                </button>
                
                <button type="button">
                    <a href="sign in.html">sign in</a>
                </button>
             </form>  
        </section>

        <a href="index.html"> Voltar</a>
    
</body>
</html>
